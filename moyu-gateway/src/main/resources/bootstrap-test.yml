# 监控管理
management:
  endpoints:
    web:
      exposure:
        # web暴露端点包含，默认[health]
        include: health
  endpoint:
    health: # 开启health 配置从不展示细节
      probes:
        # 是否启用活体和就绪探测
        enabled: true
      # 何时显示完整的运行状况详细信息
      show-details: never
  health:
    # 存活探针: /actuator/health/liveness
    livenessState:
      enabled: true
    # 就绪探针: /actuator/health/readiness
    readinessState:
      enabled: true

# spring配置
spring:
  # spring-cloud
  cloud:
    #  gateway 配置
    gateway:
      discovery:
        # 定位器
        locator:
          enabled: true      # 开启从注册中心动态创建路由的功能，利用微服务名进行路由
      routes:
        - id: xxx-service-routh               # 路由的ID，没有固定规则但要求唯一，建议配合服务名
          uri: http://localhost:8001          # 匹配后提供服务的路由地址
          #uri: lb://xx-service-name           # 路由的目标地址,lb是负载均衡，后面是服务名称
          predicates:
            - Path=/user/**                # 断言，路径匹配。以/user/开头的所有请求

        - id: xxx-service-routh2               # 路由的ID，没有固定规则但要求唯一，建议配合服务名
          uri: http://localhost:8002          # 匹配后提供服务的路由地址
          #uri: lb://xx-service-name           # 路由的目标地址,lb是负载均衡，后面是服务名称
          predicates:
            - Path=/auth/**                # 断言，路径匹配。以/user/开头的所有请求

    # huawei服务治理配置(服务注册发现)
    servicecomb:
      # 服务注册
      service:
        # 微服务名称（不填则为配置的spring.application.name值）
        name: ${spring.application.name}
        # 微服务所属应用名称。应用名称相同的微服务之间才可以相互发现，常用作应用隔离（版本1.10.2-2021.0.x及之前通过discovery.appName配置）
        application: default
        # 微服务注册环境（环境名称相同的微服务之间才可以相互发现，常用作环境隔离）
        environment:
      # 服务发现
      discovery:
        # 是否开启服务发现能力
        enabled: true
        # 心跳检测时间，单位为秒
        healthCheckInterval: 15
        # 拉取实例的轮询时间，单位为毫秒
        pollInterval: 15000
        # 无损下线等待时长，单位为毫秒
        waitTimeForShutDownInMillis: 15000
        # 注册发现地址（必填）
        address: http://192.168.110.156:30100
      # 配置中心
      config:
        # 是否启用动态配置
        enabled: true
        # 配置中心地址
        serverAddr: http://192.168.110.156:30110
        # 配置中心类型 （kie或config-center，推荐使用kie）
        serverType: kie
